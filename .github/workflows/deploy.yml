name: Verify and optionally deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, build and static verification
        run: npm run verify
        env:
          SITE_URL: https://kaustubhdua.github.io/Portfolio-

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Browser, performance and accessibility verification
        run: |
          npm run preview &
          npx wait-on http://localhost:4173 --timeout 30000
          npm run test:e2e
          npm run audit

      - name: Verify external project and evidence links
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Vercel is the canonical production host. Enable this job only after Pages is configured.
  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
