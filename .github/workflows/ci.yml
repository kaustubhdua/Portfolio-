name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is committed yet. Once `npm install` has produced one, switch to `npm ci`.
      - run: npm install
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the production build
        run: |
          npm run preview &
          npx wait-on http://localhost:4173 --timeout 30000
          npm run test:e2e

  # Weekly-style safety net: flags dead or login-walled project links. Reported, never blocking.
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:links
