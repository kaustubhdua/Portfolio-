name: CI
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One-time bootstrap: generate and commit the npm lockfile on this review branch.
      - name: Install dependencies for lockfile bootstrap
        run: npm install --no-audit --no-fund --loglevel verbose
      - name: Commit generated lockfile to the review branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/portfolio-quality-release-20261108'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Static distribution checks
        run: npm run check
      - name: Offline voxel-world tests
        run: npm run test:world
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests and performance/accessibility audit
        run: |
          npm run preview &
          npx wait-on http://localhost:4173 --timeout 30000
          npm run test:e2e
          npm run audit
      - name: Upload diagnostics if verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-verify-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ~/.npm/_logs/**
            playwright-report/**
            test-results/**

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies for link checker
        run: npm install --no-audit --no-fund --loglevel verbose
      - name: Check external project and evidence links
        run: npm run check:links
      - name: Upload link-check diagnostics if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-link-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: ~/.npm/_logs/**
