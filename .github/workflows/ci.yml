name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep npm install until a lockfile is committed; then switch to npm ci.
      - run: npm install
      - name: Lint, build, static checks, and voxel-world tests
        run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Browser tests and performance audit against the production build
        run: |
          npm run preview &
          npx wait-on http://localhost:4173 --timeout 30000
          npm run test:e2e
          npm run audit

  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:links
