name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci needs a real committed lockfile. Keep install until one exists.
      - name: Install dependencies (retain verbose npm diagnostics)
        run: npm install --no-audit --no-fund --loglevel verbose
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Static distribution checks
        run: npm run check
      - name: Offline voxel-world tests
        run: npm run test:world
      - run: npx playwright install --with-deps chromium
      - name: Browser tests and performance audit against the production build
        run: |
          npm run preview &
          npx wait-on http://localhost:4173 --timeout 30000
          npm run test:e2e
          npm run audit
      - name: Upload npm and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ci-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ~/.npm/_logs/**
            playwright-report/**
            test-results/**

  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep npm install until package-lock.json is committed.
      - name: Install dependencies for link checker
        run: npm install --no-audit --no-fund --loglevel verbose
      - name: Check external project and evidence links
        run: npm run check:links
      - name: Upload npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-link-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: ~/.npm/_logs/**
